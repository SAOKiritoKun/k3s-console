<script>
  (function () {
    try {
      var theme = localStorage.getItem('k3s-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) { /* localStorage 不可用时沿用默认主题 */ }
  })();
</script>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 2.5 27.7 9v14L16 29.5 4.3 23V9L16 2.5Z" stroke="#60a5fa" stroke-width="1.4" fill="rgba(59,130,246,.12)"/><path d="M16 8.2 22.6 12v7.8L16 23.6 9.4 19.8V12L16 8.2Z" fill="#3b82f6" fill-opacity=".28" stroke="#93c5fd" stroke-width="1.1"/><circle cx="16" cy="16" r="2.4" fill="#67e8f9"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name" id="brandName">k3s 集群管家</div>
        <div class="brand-sub">k3s · Kubernetes</div>
      </div>
    </div>

    <div class="nav-label">控制台</div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-view="dashboard" title="概览">
        <svg><use href="#i-grid"/></svg><span>概览</span>
      </button>
      <button class="nav-item" data-view="hosts" title="服务器">
        <svg><use href="#i-server"/></svg><span>服务器</span>
      </button>
      <button class="nav-item" data-view="workloads" title="工作负载">
        <svg><use href="#i-layers"/></svg><span>工作负载</span>
      </button>
      <div class="nav-group" id="deployNavGroup">
        <button class="nav-item nav-parent" data-view="deploy" title="部署中心" aria-expanded="false" aria-controls="deploySubNav">
          <svg><use href="#i-rocket"/></svg><span>部署中心</span><svg class="nav-caret" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="nav-sub" id="deploySubNav" aria-label="部署中心二级菜单">
          <button class="nav-subitem" data-deploy-tab="install" title="k3s 安装/卸载"><i class="nav-sub-dot"></i><span>k3s 安装/卸载</span></button>
          <button class="nav-subitem" data-deploy-tab="upgrade" title="k3s 升级"><i class="nav-sub-dot"></i><span>k3s 升级</span></button>
          <button class="nav-subitem" data-deploy-tab="components" title="组件与镜像"><i class="nav-sub-dot"></i><span>组件与镜像</span></button>
          <button class="nav-subitem" data-deploy-tab="custom" title="Pod 部署"><i class="nav-sub-dot"></i><span>Pod 部署</span></button>
        </div>
      </div>
      <button class="nav-item" data-view="jobs" title="操作记录">
        <svg><use href="#i-activity"/></svg><span>操作记录</span><span class="nav-badge hidden" id="jobBadge">0</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="conn-box">
        <div class="conn-row"><span class="conn-k">控制台</span><span class="conn-v" id="connVersion">v1.0.0</span></div>
        <div class="conn-row"><span class="conn-k">SSH 通道</span><span id="connSsh" class="badge neutral">检测中</span></div>
        <div class="conn-row"><span class="conn-k">主机数</span><span class="conn-v" id="connHosts">0</span></div>
      </div>
      <button class="nav-item" data-view="settings" title="设置">
        <svg><use href="#i-settings"/></svg><span>设置</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="菜单"><svg><use href="#i-menu"/></svg></button>
      <div class="topbar-main">
        <div class="page-kicker" id="pageKicker">OVERVIEW</div>
        <h1 class="page-title" id="pageTitle">概览</h1>
        <p class="page-sub" id="pageSub">服务器与集群汇总，点击数字查看明细</p>
      </div>
      <div class="top-actions">
        <div class="host-picker hidden" id="hostPicker">
          <button class="host-picker-btn" id="hostPickerBtn" title="选择服务器"></button>
        </div>
        <button class="icon-btn" id="refreshBtn" title="刷新"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn theme-btn" id="themeBtn" type="button" title="切换为白天模式" aria-label="切换为白天模式" aria-pressed="false">
          <svg class="theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
        <span class="status-pill" id="apiStatus"><i class="dot warn pulse"></i><span>连接中</span></span>
      </div>
    </header>

    <section class="view" id="view">
      <div class="boot-splash" id="bootSplash">
        <div class="boot-splash-card">
          <div class="boot-splash-logo">
            <span class="boot-spinner"></span>
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.5 27.7 9v14L16 29.5 4.3 23V9L16 2.5Z" stroke="#60a5fa" stroke-width="1.4" fill="rgba(59,130,246,.12)"/><path d="M16 8.2 22.6 12v7.8L16 23.6 9.4 19.8V12L16 8.2Z" fill="#3b82f6" fill-opacity=".28" stroke="#93c5fd" stroke-width="1.1"/><circle cx="16" cy="16" r="2.4" fill="#67e8f9"/></svg>
          </div>
          <h2 class="boot-splash-title" id="bootSplashTitle">正在连接控制台</h2>
          <p class="boot-splash-text" id="bootSplashText">正在读取服务状态和服务器列表，首次启动可能需要几秒…</p>
          <div class="boot-splash-steps">
            <span class="boot-step" data-boot-step="boot"><i></i>服务连接</span>
            <span class="boot-step" data-boot-step="hosts"><i></i>服务器列表</span>
            <span class="boot-step" data-boot-step="ready"><i></i>准备界面</span>
          </div>
          <p class="boot-splash-hint" id="bootSplashHint"></p>
        </div>
      </div>
    </section>
  </div>
</div>
